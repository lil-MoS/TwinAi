<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #2c3e50; }
        p { color: #555; line-height: 1.6; }
        .badge {
            background: #3498db;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .btn {
            background: #2c3e50;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { background: #34495e; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">✅ تست موفق</div>
        <h1>سلام! این یک صفحه تستی است</h1>
        <p>این فایل به عنوان نمونه برای تست ابزار <strong>sitesaz</strong> ساخته شده است.</p>
        <p>اگر اینجا هستید، یعنی مراحل آپلود و فعال‌سازی به درستی انجام شده.</p>
        <button class="btn" onclick="alert('تبریک! 🎉')">کلیک کنید</button>
    </div>
</body>
</html>
